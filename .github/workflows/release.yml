name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: qr-gen-premium-linux
            archive_name: qr-gen-premium-linux.tar.gz
          - os: windows-latest
            artifact_name: qr-gen-premium-windows
            archive_name: qr-gen-premium-windows.zip
          - os: macos-latest
            artifact_name: qr-gen-premium-macos
            archive_name: qr-gen-premium-macos.zip

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build with PyInstaller
        run: python scripts/build.py

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf ../${{ matrix.archive_name }} *

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent . ../${{ matrix.archive_name }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\* -DestinationPath ${{ matrix.archive_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive_name }}