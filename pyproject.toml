[project]
name = "qr-gen-premium"
version = "1.0.0"
description = "A premium QR code generator desktop application"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "QR Gen Premium"}]
dependencies = [
    "PySide6>=6.6.0",
    "qrcode[pil]>=7.4.2",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "domain*", "services*", "ui*", "widgets*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.pytest.ini_options.env]
QT_QPA_PLATFORM = "offscreen"
